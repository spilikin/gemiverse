<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply persisted Carbon theme before first paint to avoid a flash.
			// Carbon's productive pairing: g10 (light, default) / g90 (dark).
			// See $lib/theme.svelte.ts for the full story including legacy
			// white→g10 / g100→g90 migration.
			(function () {
				try {
					var v = localStorage.getItem('gemiverse:theme');
					var t = v === 'g90' || v === 'g100' ? 'g90' : 'g10';
					document.documentElement.setAttribute('data-carbon-theme', t);
				} catch (e) {
					document.documentElement.setAttribute('data-carbon-theme', 'g10');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
